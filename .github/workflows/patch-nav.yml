name: Remove duplicate nav CSS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch nav CSS
        run: python3 .github/patch_nav.py

      - name: Commit and clean up
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/globals.css app/nav.css
          git commit -m "Let nav.css own the nav rules instead of globals.css"
          rm -f .github/workflows/patch-nav.yml .github/patch_nav.py
          git add -A
          git commit -m "Remove the nav CSS patch workflow"
          git push
