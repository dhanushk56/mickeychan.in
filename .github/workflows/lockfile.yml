name: Refresh lockfile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate the lockfile from package.json
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit the lockfile when it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package-lock.json for the pinned dependency versions"
          git push
