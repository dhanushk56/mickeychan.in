name: Harden origin check and client IP
on:
  push:
    paths:
      - ".github/workflows/harden.yml"
  workflow_dispatch:
jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/harden.py
      - name: Check the build inputs look right
        run: |
          grep -c "clientKey" lib/request-ips.js
          grep -c "export default function proxy" proxy.js
      - name: Commit and remove workflow
        run: |
          rm -f .github/harden.py .github/workflows/harden.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add the shared origin guard, prefer x-vercel-forwarded-for, count failed signups"
          git push
