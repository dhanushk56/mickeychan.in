name: Apply year fix
on:
  push:
    paths:
      - "transfer/go.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/years.patch
          echo "patch sha: $(sha256sum /tmp/years.patch)"
          test "$(sha256sum /tmp/years.patch | cut -d' ' -f1)" = "e210cfc6d08bf23f6c755b1c75641f812ad283201fbbef2c12864c466543a83b"
          git apply /tmp/years.patch
          rm -rf transfer .github/workflows/apply-years.yml
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Read publish dates from relative upload ages so the year filter lists every year"
          git push
