name: Apply library
on:
  push:
    paths:
      - "transfer/go5.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/f.patch
          test "$(sha256sum /tmp/f.patch | cut -d' ' -f1)" = "d299a3faec0298922f0a09087cd0e9a11fc5ecda0f15355bf28a051b14da674a"
          git apply /tmp/f.patch
          rm -rf transfer .github/workflows/apply-library.yml
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Dashboard shell with watch later, playlists and history"
          git push
