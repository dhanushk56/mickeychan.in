name: Title crawl
on:
  push:
    paths:
      - ".github/workflows/route-intro8.yml"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the crawl
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys

          p = 'app/page-wipe.css'
          s = open(p).read()

          s = s.replace(
              'is dragged across with her hands from 2.0s, landing at 2.45s, held one second.',
              'crawls across in front of her from 1.85s and is gone by 2.95s, never stopping.',
          )

          s = s.replace('page-wipe-veil 3750ms', 'page-wipe-veil 3200ms')
          s = s.replace('page-wipe-cast 3750ms', 'page-wipe-cast 3200ms')
          s = s.replace('page-wipe-name 3750ms', 'page-wipe-name 3200ms')
          s = s.replace(
              '  96% { opacity: 1; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }',
              '  94% { opacity: 1; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }',
          )

          s = s.replace(
              '/* Character: plays through 72% (2.7s), then sinks, shrinks and fades by 82.7%\n   (3.1s), so it is gone while the title is settling. */',
              '/* Character: plays through 84.4% (2.7s), then sinks, shrinks and fades by 95.3%\n   (3.05s), so it is gone as the crawl leaves the frame. */',
          )
          s = s.replace('  72% {\n    opacity: 1;\n    transform: scale(1.02)', '  84.4% {\n    opacity: 1;\n    transform: scale(1.02)')
          s = s.replace('  82.7% {\n    opacity: 0;', '  95.3% {\n    opacity: 0;')

          start = s.index('/* Name:')
          end = s.index('/* The overlay is opaque')
          new = '''/* Name: a crawl, not a reveal. It slides in from the left at 1.85s, passes centre
   at 2.40s while her hands are finishing, and carries on out of the right edge by
   2.95s - constant speed, no pause, sitting in front of her so she is behind it. */
@keyframes page-wipe-name {
  0%, 57.8% {
    opacity: 0;
    transform: translate3d(-104%, 0, 0);
  }
  59.5% {
    opacity: 1;
    transform: translate3d(-96%, 0, 0);
    animation-timing-function: linear;
  }
  75% {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }
  92.2% {
    opacity: 1;
    transform: translate3d(104%, 0, 0);
  }
  100% {
    opacity: 0;
    transform: translate3d(112%, 0, 0);
  }
}

'''
          s = s[:start] + new + s[end:]

          if '-22vh' in s:
              sys.exit('lift still present')
          if s.count('3200ms') != 3:
              sys.exit('durations not rewritten')
          if 'translate3d(104%, 0, 0)' not in s:
              sys.exit('crawl exit missing')
          open(p, 'w').write(s)

          j = 'components/RouteWipe.js'
          t = open(j).read()
          t = t.replace(
              '// Character plays to 2.7s and sinks away by 3.1s. The page name is dragged across\n// by her hands from 2.0s, lands at 2.45s, holds for one second, clears at 3.75s.\nconst DURATION = 3750;',
              '// Character plays to 2.7s and sinks away by 3.05s. The page name crawls in from\n// the left at 1.85s and out the right by 2.95s without stopping.\nconst DURATION = 3200;',
          )
          if 'const DURATION = 3200;' not in t:
              sys.exit('DURATION not patched')
          open(j, 'w').write(t)
          PY
          grep -q '3200ms' app/page-wipe.css
          grep -q 'DURATION = 3200' components/RouteWipe.js
          git diff --stat
      - name: Commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/route-intro8.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Turn the intro title into a crawl in front of her"
          git push
