name: 503 when signup cannot sign a code
on:
  push:
    paths:
      - ".github/workflows/harden4.yml"
  workflow_dispatch:
jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/harden4.py
      - name: Check the guard landed
        run: grep -c "isCodeSecretConfigured" app/api/auth/register/route.js
      - name: Commit and remove workflow
        run: |
          rm -f .github/harden4.py .github/workflows/harden4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Return 503 when sign-up cannot sign a confirmation code"
          git push
