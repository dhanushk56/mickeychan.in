name: Route intro mp4
on:
  push:
    paths:
      - ".github/workflows/route-intro3.yml"
  workflow_dispatch:

jobs:
  media:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Encode the opaque intro
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          git show bef4ccc:public/2026-11-24_19-44-28.mp4 > /tmp/src.mp4
          ffmpeg -y -loglevel error -i /tmp/src.mp4 \
            -f lavfi -i "color=c=0x07050e:s=720x720:d=4:r=30" \
            -filter_complex "[0:v]chromakey=0x28c828:0.12:0.08,despill=type=green,crop=720:720:280:0,format=rgba[fg];[1:v]format=rgba[bg];[bg][fg]overlay=0:0:shortest=1:format=auto,fps=30,format=yuv420p[v]" \
            -map "[v]" -c:v libx264 -preset medium -crf 24 -movflags +faststart -an \
            public/media/route-intro.mp4
          ffmpeg -y -loglevel error -ss 0.95 -i public/media/route-intro.mp4 -frames:v 1 -q:v 4 \
            public/media/route-intro-poster.jpg
          ls -l public/media
      - name: Commit the assets
        run: |
          set -euo pipefail
          rm -f .github/workflows/route-intro3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Encode the route intro as opaque H.264"
          git push
