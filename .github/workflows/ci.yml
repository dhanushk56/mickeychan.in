name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADMIN_PASSWORD: smoke-console-password
      SESSION_SECRET: smoke-session-secret
      SMOKE_OWNER_PASSWORD: Smoke-Owner-Pass-2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check the record store under concurrency
        run: npm run data-model

      - name: Seed the owner account the smoke suite signs in as
        run: npm run smoke:seed

      - name: Build
        run: npm run build

      - name: Smoke the auth surface
        run: npm run smoke
