name: Apply video fix
on:
  push:
    paths:
      - "transfer/trigger.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/ve.patch
          echo "patch sha: $(sha256sum /tmp/ve.patch)"
          test "$(sha256sum /tmp/ve.patch | cut -d' ' -f1)" = "9360c83527923f4911c91495078b74cf39f0161e4068ccdfb399701b1badd7f4"
          git apply /tmp/ve.patch
          rm -rf transfer .github/workflows/apply-fix.yml
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Count Shorts as short in the length filter"
          git push
