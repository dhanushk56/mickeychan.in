name: Single origin check and fail-closed secret
on:
  push:
    paths:
      - ".github/workflows/harden2.yml"
  workflow_dispatch:
jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/harden2.py
      - name: Check no inline copies remain
        run: |
          ! grep -rn "function sameOrigin(request)" app lib
          ! grep -rn "dev-secret-change-me" lib
      - name: Commit and remove workflow
        run: |
          rm -f .github/harden2.py .github/workflows/harden2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Drop the duplicated origin checks and fail closed without a signing secret"
          git push
