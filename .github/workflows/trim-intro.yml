name: trim-intro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trim and re-encode the intro clip
        run: |
          ffmpeg -y -v error -i public/media/route-intro.mp4 -t 2.62 \
            -c:v libx264 -preset veryslow -crf 22 -tune animation \
            -profile:v high -level 4.2 -pix_fmt yuv420p -g 120 \
            -movflags +faststart -an /tmp/route-intro.mp4
          cp /tmp/route-intro.mp4 public/media/route-intro.mp4
          ls -l public/media/route-intro.mp4
      - name: Commit the smaller clip
        run: |
          git config user.name "mickeychan-bot"
          git config user.email "bot@mickeychan.in"
          git rm -q .github/workflows/trim-intro.yml
          git add public/media/route-intro.mp4
          git commit -m "Shrink the intro clip so it always has time to load"
          git push
