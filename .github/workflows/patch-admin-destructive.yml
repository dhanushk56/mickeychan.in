name: Patch admin destructive buttons

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-admin-destructive.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: python3 .github/patch_admin_destructive.py

      - name: Commit and remove this job
        run: |
          rm -f .github/patch_admin_destructive.py .github/workflows/patch-admin-destructive.yml
          git config user.name "freebuff"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Give Block forms and Delete account the same pill surface as the other actions"
          git push
