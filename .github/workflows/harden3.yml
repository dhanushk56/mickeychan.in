name: 503 when the code secret is missing
on:
  push:
    paths:
      - ".github/workflows/harden3.yml"
  workflow_dispatch:
jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/harden3.py
      - name: Check the guards landed
        run: |
          grep -c "isCodeSecretConfigured" lib/password-reset.js lib/email-verification.js
          grep -rln "isCodeSecretConfigured" app/api/auth
      - name: Commit and remove workflow
        run: |
          rm -f .github/harden3.py .github/workflows/harden3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Return 503 instead of 500 when the code signing secret is missing"
          git push
