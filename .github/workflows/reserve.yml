name: Reserve super-owner handle
on:
  push:
    paths:
      - ".github/workflows/reserve.yml"
  workflow_dispatch:
jobs:
  reserve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/reserve.py
      - name: Commit and remove workflow
        run: |
          rm -f .github/reserve.py .github/workflows/reserve.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reserve the super-owner username in usernameProblem"
          git push
