name: Apply UI fix
on:
  push:
    paths:
      - "transfer/go2.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/ui.patch
          echo "patch sha: $(sha256sum /tmp/ui.patch)"
          test "$(sha256sum /tmp/ui.patch | cut -d' ' -f1)" = "82ddb0212378269be3dc393a4f20607323d98c68b8d4ff32bd891343dffd23ae"
          git apply /tmp/ui.patch
          rm -rf transfer .github/workflows/apply-ui.yml
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Centre the tab bars, make the contact kicker a block, drop the duplicate footer link"
          git push
