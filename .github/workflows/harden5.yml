name: Gate signup on the session secret
on:
  push:
    paths:
      - ".github/workflows/harden5.yml"
  workflow_dispatch:
jobs:
  harden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/harden5.py
      - name: Check the guard
        run: grep -n "if (!isCodeSecretConfigured())" app/api/auth/register/route.js
      - name: Commit and remove workflow
        run: |
          rm -f .github/harden5.py .github/workflows/harden5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Gate sign-up on the session secret even when email is off"
          git push
