name: Apply phase 1 finish
on:
  push:
    paths:
      - "transfer/go4.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/e.patch
          test "$(sha256sum /tmp/e.patch | cut -d' ' -f1)" = "f96d002a1c4fb1590d1015089dce8d9725026bd6ba75bfff8e2959c82debfff5"
          git apply /tmp/e.patch
          rm -rf transfer .github/workflows/apply-phase1.yml
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Finish the 1.x deliverables: passing smoke suite, availability field, revalidating video cache"
          git push
