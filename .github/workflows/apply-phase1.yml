name: Apply phase 1 change set
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Rebuild and check the patch
        run: |
          set -euo pipefail
          cat transfer/c00.b64 transfer/c01.b64 transfer/c02.b64 transfer/c03.b64 transfer/c04.b64 transfer/c05.b64 > /tmp/changes.patch.gz
          gunzip -c /tmp/changes.patch.gz > /tmp/changes.patch
          echo "04307be6da4ec7b5732c5dcc222be040d9314bfedeb77b83c8d53fe7631744c2  /tmp/changes.patch" | sha256sum -c -
          git apply --check /tmp/changes.patch
          git apply /tmp/changes.patch
          git status --short | head -40
      - name: Commit the change set
        run: |
          set -euo pipefail
          git config user.name "Mickey Chan Bot"
          git config user.email "bot@mickeychan.in"
          git add -A
          git reset -q transfer .github/workflows/apply-phase1.yml
          git commit -m "Add video discovery, per-video pages, channel views and public contact"
          git push
      - name: Remove the transfer files
        run: |
          set -euo pipefail
          rm -rf transfer .github/workflows/apply-phase1.yml
          git add -A
          git commit -m "Remove the transfer workflow"
          git push
