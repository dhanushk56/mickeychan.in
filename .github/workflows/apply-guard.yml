name: Apply cache guard
on:
  push:
    paths:
      - "transfer/go3.txt"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/g.patch
          echo "patch sha: $(sha256sum /tmp/g.patch)"
          test "$(sha256sum /tmp/g.patch | cut -d' ' -f1)" = "0bb4adffd5156381acbe756db7f89cc70a1ee82d350577f9e15ed427c63a8eca"
          git apply /tmp/g.patch
          rm -rf transfer .github/workflows/apply-guard.yml
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Keep the fuller video list when a scrape returns a fraction of the catalogue"
          git push
