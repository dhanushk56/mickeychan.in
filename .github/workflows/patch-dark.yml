name: Apply dark-only patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch theme files
        run: python3 .github/patch_dark.py

      - name: Commit and clean up
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/globals.css app/hover.css
          git commit -m "Make the site dark-only and drop the theme switch"
          rm -f .github/workflows/patch-dark.yml .github/patch_dark.py
          git add -A
          git commit -m "Remove the dark-only patch workflow"
          git push
