name: Route intro media
on:
  push:
    paths:
      - ".github/workflows/route-intro.yml"
  workflow_dispatch:

jobs:
  media:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Transcode the intro animation
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p public/media
          src="public/2026-11-24_19-44-28.mp4"
          key="chromakey=0x28c828:0.12:0.08,despill=type=green,crop=720:720:280:0"
          ffmpeg -y -loglevel error -i "$src" \
            -vf "setpts=PTS/1.8,$key,fps=30" \
            -c:v libvpx-vp9 -pix_fmt yuva420p -b:v 0 -crf 33 -row-mt 1 -an \
            public/media/route-intro.webm
          ffmpeg -y -loglevel error -ss 0.9 -i "$src" -frames:v 1 -vf "$key" \
            public/media/route-intro-poster.png
          ls -l public/media
      - name: Commit the assets
        run: |
          set -euo pipefail
          rm -f .github/workflows/route-intro.yml
          git rm -q public/2026-11-24_19-44-28.mp4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Key out the route intro animation at two seconds"
          git push
