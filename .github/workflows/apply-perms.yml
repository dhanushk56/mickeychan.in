name: Apply community permissions patch
on:
  push:
    paths:
      - "transfer/go13.txt"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          cat transfer/p3/00.b64 transfer/p3/01.b64 transfer/p3/02.b64 transfer/p3/03.b64 transfer/p3/04.b64 transfer/p3/05.b64 transfer/p3/06.b64 transfer/p3/07.b64 | base64 -d > /tmp/p3.patch
          sha=$(sha256sum /tmp/p3.patch | cut -d' ' -f1)
          echo "patch sha: $sha"
          test "$sha" = "7a7016f1acc7493a6d92109b745db7ca489de2b3598ae79739d2727eed203d86"
          wc -c /tmp/p3.patch
          git apply --check /tmp/p3.patch
          git apply /tmp/p3.patch
          rm -rf transfer
          git rm -q .github/workflows/apply-perms.yml
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Give polls, events and ideas their own permissions and one vote count"
          git push
