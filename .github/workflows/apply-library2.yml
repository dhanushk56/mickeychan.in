name: Apply library 2
on:
  push:
    paths:
      - "transfer/go7.txt"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -euo pipefail
          for n in 1 2 3 4; do echo "chunk $n bytes: $(wc -c < transfer/lib$n.b64)"; done
          cat transfer/lib1.b64 transfer/lib2.b64 transfer/lib3.b64 transfer/lib4.b64 > /tmp/all.b64
          echo "total bytes: $(wc -c < /tmp/all.b64)"
          base64 -d /tmp/all.b64 | gunzip > /tmp/f.patch
          echo "patch bytes: $(wc -c < /tmp/f.patch)"
          echo "patch sha: $(sha256sum /tmp/f.patch | cut -d' ' -f1)"
          test "$(sha256sum /tmp/f.patch | cut -d' ' -f1)" = "d299a3faec0298922f0a09087cd0e9a11fc5ecda0f15355bf28a051b14da674a"
          git apply /tmp/f.patch
          rm -rf transfer .github/workflows/apply-library.yml
          git rm -q .github/workflows/apply-library2.yml
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A
          git commit -m "Dashboard shell with watch later, playlists and history"
          git push
